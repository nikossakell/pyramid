[project]
name = "pyramid-backend"
version = "0.4.0"
description = "PYRAMID backend: API, deterministic rule engine and local AI pipeline"
requires-python = ">=3.11"
license = { file = "../LICENSE" }

# Πάγωμα για τις 12 εβδομάδες της μελέτης: ακριβείς εκδόσεις (==) για ό,τι είναι εγκατεστημένο στο venv
# (09/11/2026, Python 3.14). Τα υπόλοιπα (>=) δεν είναι ακόμα εγκατεστημένα και καρφώνονται όταν εγκατασταθούν.
# ΑΝΟΙΧΤΗ ΑΠΟΦΑΣΗ: ίδια Python 3.12 σε venv και Docker (το Dockerfile χτίζει ακόμα με 3.11).
dependencies = [
  # --- API ---
  "fastapi==0.162.2",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "tzdata==2026.6",               # APP_TIMEZONE χωρίς να εξαρτάται από τη βάση ζωνών του λειτουργικού
  # ΣΚΟΠΙΜΑ χωρίς python-multipart: χωρίς αυτό το FastAPI αρνείται να φορτώσει endpoint με UploadFile/Form,
  # άρα καμία φωτογραφία δεν μπορεί να γραφτεί σε προσωρινό αρχείο (R4, Κανόνας 7).
  # --- Persistence ---
  "sqlalchemy==2.1.8",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.8",
  # --- Security ---
  # Χωρίς argon2-cffi: τα κλειδιά πρόσβασης είναι τυχαία 60 bit, αρκεί HMAC-SHA256 με pepper.
  # Χωρίς cryptography: καμία κρυπτογράφηση πεδίων (κανένα docs/*.md δεν την υπόσχεται).
  "pyjwt==2.15.1",
  # --- Reference data and maths ---
  "pandas>=2.2",
  # numpy ΟΧΙ ==: η εγκατεστημένη 2.5.4 θέλει Python >= 3.12, ενώ το Dockerfile χτίζει με 3.11.
  "numpy>=1.26",
  # --- Scheduling (replaces Celery; no Redis in the stack) ---
  "apscheduler>=3.10",
  # --- Vision: OliveGemma + NSFW detector ---
  "torch>=2.5",
  "transformers>=4.46",
  "accelerate>=1.1",
  "pillow==13.0.0",
  # --- Text: Krikri over llama.cpp's HTTP server ---
  "httpx==0.28.1",
  # --- RAG ---
  # Καρφωμένη: το rag_db χτίστηκε με 1.5.9 και το content_hash εξαρτάται από το πώς το chromadb
  # αποθηκεύει τα διανύσματα (κανονικοποίηση με cosine). Αλλαγή έκδοσης => rebuild ή repair του rag_db.
  # Βλ. docs/decisions/2026-10-28_rag_ingestion.txt, Απόφαση 3δ.
  "chromadb==1.5.9",
  "sentence-transformers>=3.2",
  "pypdf>=5.1",
  # --- Observability ---
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "httpx==0.28.1",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-pyyaml",
]
food-gate = [
  # Only needed by scripts/train_food_gate.py; kept out of the runtime image.
  "tensorflow>=2.17",
  "tensorflowjs>=4.22",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "rule_engine", "ai_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "slow: needs a model loaded",
  "gpu: needs a GPU",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
