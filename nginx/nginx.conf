user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rule 7: the access log records the request line and sizes, never a body.
    log_format  minimal  '$remote_addr - [$time_local] "$request" '
                         '$status $body_bytes_sent $request_time';
    access_log  /var/log/nginx/access.log  minimal;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip  on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml;

    # Default: small bodies only. The photo endpoint sets its own limits.
    client_max_body_size      1m;
    client_body_buffer_size   1m;

    include /etc/nginx/conf.d/*.conf;
}
