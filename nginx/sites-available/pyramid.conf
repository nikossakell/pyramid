# PYRAMID reverse proxy.
# TLS lines are commented out for local development; enable them in production
# (certificates are mounted at /etc/nginx/ssl, gitignored).

upstream pyramid_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # add_header Strict-Transport-Security "max-age=31536000" always;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # --- Meal photo: Rule 7 depends on these three lines ---------------------
    # The body must fit in the buffer, so Nginx never spools it to a temp file.
    location = /api/meals/photo {
        client_max_body_size        1m;
        client_body_buffer_size     1m;
        client_body_in_file_only    off;
        proxy_request_buffering     on;
        proxy_read_timeout          120s;

        proxy_pass http://pyramid_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Admin: university VPN only -----------------------------------------
    location /api/admin/ {
        allow 10.0.0.0/8;
        deny  all;
        proxy_pass http://pyramid_backend;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://pyramid_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Unity WebGL build ---------------------------------------------------
    location /game/ {
        alias /usr/share/nginx/html/game/;
        types {
            application/wasm        wasm;
            application/octet-stream data;
        }
        add_header Cross-Origin-Opener-Policy  same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
    }

    # --- PWA -----------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
