<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<title>BottomNav</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&amp;family=DM+Serif+Display&amp;family=Noto+Serif+Display:wght@600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Κύρια πλοήγηση" style="width: 390px; height: 88px; box-sizing: border-box; padding: 6px 8px 22px; background: #FFFFFF; border-top: 1px solid #E2DDD5; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; font-family: Commissioner, 'Noto Sans', system-ui, sans-serif">
<a href="#today" aria-current="{{t.today.current}}" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{t.today.fg}}">
<span style="width: 56px; height: 30px; border-radius: 999px; background: {{t.today.pill}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>
<span style="font-size: 13px; font-weight: {{t.today.weight}}">Σήμερα</span>
</a>
<a href="#history" aria-current="{{t.history.current}}" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{t.history.fg}}">
<span style="width: 56px; height: 30px; border-radius: 999px; background: {{t.history.pill}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>
<span style="font-size: 13px; font-weight: {{t.history.weight}}">Ιστορικό</span>
</a>
<a href="#log" aria-label="Νέα καταγραφή" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; text-decoration: none; color: #000000">
<span style="width: 60px; height: 60px; margin-top: -26px; border-radius: 999px; background: #F14711; border: 4px solid #FFFFFF; box-shadow: 0 4px 14px rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
<span style="font-size: 13px; font-weight: 700">Καταγραφή</span>
</a>
<a href="#chat" aria-current="{{t.chat.current}}" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{t.chat.fg}}">
<span style="width: 56px; height: 30px; border-radius: 999px; background: {{t.chat.pill}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg></span>
<span style="font-size: 13px; font-weight: {{t.chat.weight}}">Βοηθός</span>
</a>
<a href="#cards" aria-current="{{t.cards.current}}" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{t.cards.fg}}">
<span style="position: relative; width: 56px; height: 30px; border-radius: 999px; background: {{t.cards.pill}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3" width="12" height="16" rx="2"></rect><path d="M5 7v12a2 2 0 0 0 2 2h9"></path></svg>
<sc-if value="{{showBadge}}" hint-placeholder-val="{{ false }}"><span aria-label="Νέες κάρτες" style="position: absolute; top: 0; right: 10px; width: 12px; height: 12px; border-radius: 999px; background: #B1318E; border: 2px solid #FFFFFF"></span></sc-if>
</span>
<span style="font-size: 13px; font-weight: {{t.cards.weight}}">Κάρτες</span>
</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","history","chat","cards","none"],"default":"today"},"badge":{"editor":"boolean","default":false},"$preview":{"width":390,"height":88}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'today';
const mk = (k) => active === k
? { fg: '#000000', pill: '#F14711', weight: '700', current: 'page' }
: { fg: '#5E5953', pill: 'transparent', weight: '500', current: 'false' };
return {
t: { today: mk('today'), history: mk('history'), chat: mk('chat'), cards: mk('cards') },
showBadge: this.props.badge ?? false
};
}
}
</script>
</body>
</html>
