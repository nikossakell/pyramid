# Development stack. Production overrides live in docker-compose.prod.yml.
name: pyramid

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on: [backend]
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-available:/etc/nginx/conf.d:ro
      - ./game/webgl_build:/usr/share/nginx/html/game:ro
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/app/data:ro
      - ./backend/models:/app/models:ro
      - ./backend/rag_db:/app/rag_db
    # OliveGemma + the NSFW detector run on the GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  llm:
    # Krikri 8B Q4_K_M served by llama.cpp.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    env_file: .env
    volumes:
      - ./backend/models:/models:ro
    command: >
      -m /models/krikri-8b-instruct-q4_k_m.gguf
      --host 0.0.0.0 --port 8080
      -c 8192 -ngl 99 --no-webui
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
